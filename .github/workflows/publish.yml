# Native AOT packaging for MiniOCR across major platforms.
#
# x64 AOT artifacts come in two SIMD tiers. ILC bakes the CPU instruction set in at
# compile time (Native AOT does not dispatch at run time), so SimdPaddleOCR's AVX2 /
# AVX-512 kernels only exist when the matching tier is compiled in:
#
#   (unsuffixed)  IlcInstructionSet=avx2      Haswell (2013)+, portable default
#   -avx512v2     IlcInstructionSet=avx512v2  AVX-512; measured ~35% faster per page
#
# A binary whose tier the CPU cannot satisfy is caught by the runtime's startup check
# and exits with "The current CPU is missing one or more of the required instruction
# sets." Other ILC names (avx512, avx512v3, avxvnni, avx10v1, x86-64-v4, ...) build the
# same way via -p:IlcInstructionSet=, just without a CI job. See the README section
# "SIMD 指令集档位".
#
# The optional MiniOcrSingleFile=true jobs are tier-less: they skip AOT, so the JIT
# probes the CPU at run time and lights up AVX2 / AVX-512 automatically. They are a
# one-binary convenience package (measured slower than AOT) that self-extracts
# libSkiaSharp / pdfium on first run.
name: Publish Native AOT

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: ${{ matrix.rid }}${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- ARM64: NEON baseline, no x64 instruction sets ---
          - rid: osx-arm64
            os: macos-latest
            simd: ""
            suffix: ""
            singlefile: false
          # Native linux-arm64 runner (no qemu). If the runner label is
          # unavailable for the repo, remove this matrix entry.
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            simd: ""
            suffix: ""
            singlefile: false

          # --- x64 SIMD tiers (two only) ---
          # avx2 = Haswell (2013)+; portable default, keeps the unsuffixed artifact name.
          - rid: win-x64
            os: windows-latest
            simd: avx2
            suffix: ""
            singlefile: false
          - rid: linux-x64
            os: ubuntu-latest
            simd: avx2
            suffix: ""
            singlefile: false
          # Highest practical tier: Ice Lake / Tiger Lake / Zen 4-5 / Sapphire Rapids
          # class. avx512v3 measures the same as avx512v2 on the reference page but
          # requires newer silicon, so v2 is the ceiling here.
          - rid: win-x64
            os: windows-latest
            simd: avx512v2
            suffix: -avx512v2
            singlefile: false
          - rid: linux-x64
            os: ubuntu-latest
            simd: avx512v2
            suffix: -avx512v2
            singlefile: false

          # --- true single-file (non-AOT): one binary, natives extract on first run ---
          - rid: win-x64
            os: windows-latest
            simd: ""
            suffix: -singlefile
            singlefile: true
          - rid: linux-x64
            os: ubuntu-latest
            simd: ""
            suffix: -singlefile
            singlefile: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 11 RC
        uses: actions/setup-dotnet@v4
        with:
          # Project TFM is net11.0; install latest 11.0.x preview/RC
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Publish (${{ matrix.rid }}${{ matrix.suffix }})
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/${{ matrix.rid }}${{ matrix.suffix }}"
          mkdir -p "$OUT"
          # Use -p: (not /p:) — Git Bash on Windows strips the leading slash and
          # MSBuild then treats "p:IlcInstructionSet=avx2" as a second project
          # (MSB1008 Only one project can be specified).
          if [ "${{ matrix.singlefile }}" = "true" ]; then
            dotnet publish ./MiniOcr.csproj \
              -c Release \
              -r "${{ matrix.rid }}" \
              --self-contained true \
              -o "$OUT" \
              -p:MiniOcrSingleFile=true
          elif [ -n "${{ matrix.simd }}" ]; then
            dotnet publish ./MiniOcr.csproj \
              -c Release \
              -r "${{ matrix.rid }}" \
              --self-contained true \
              -o "$OUT" \
              -p:IlcInstructionSet=${{ matrix.simd }}
          else
            dotnet publish ./MiniOcr.csproj \
              -c Release \
              -r "${{ matrix.rid }}" \
              --self-contained true \
              -o "$OUT"
          fi

      - name: Package zip (exclude .dbg / .pdb)
        shell: bash
        run: |
          set -euo pipefail
          RID="${{ matrix.rid }}${{ matrix.suffix }}"
          SRC="artifacts/${RID}"
          # Drop large debug symbol files if present (StripSymbols=true already)
          find "$SRC" -type f \( -name '*.dbg' -o -name '*.pdb' \) -delete || true
          mkdir -p dist
          if command -v zip >/dev/null 2>&1; then
            (cd artifacts && zip -r "../dist/miniocr-${RID}.zip" "${RID}")
          else
            # windows-latest often lacks zip(1)
            if command -v pwsh >/dev/null 2>&1; then
              pwsh -NoLogo -NoProfile -Command \
                "Compress-Archive -Path 'artifacts/${RID}/*' -DestinationPath 'dist/miniocr-${RID}.zip' -Force"
            else
              powershell -NoLogo -NoProfile -Command \
                "Compress-Archive -Path 'artifacts\\${RID}\\*' -DestinationPath 'dist\\miniocr-${RID}.zip' -Force"
            fi
          fi
          ls -la "dist/miniocr-${RID}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniocr-${{ matrix.rid }}${{ matrix.suffix }}
          path: dist/miniocr-${{ matrix.rid }}${{ matrix.suffix }}.zip
          if-no-files-found: error
          # AOT zips are large; keep Actions artifacts briefly so the repo
          # does not pile up against GitHub storage limits. Release assets
          # attached below are separate and are not governed by this.
          retention-days: 3

      - name: Attach zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/miniocr-${{ matrix.rid }}${{ matrix.suffix }}.zip
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
