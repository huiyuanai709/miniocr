name: materialize-distributed-ner

on:
  push:
    branches:
      - cursor/distributed-llm-ner-e065
    paths:
      - .github/ner-bundle.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/distributed-llm-ner-e065
          fetch-depth: 0
      - name: Apply source bundle onto main and drop this helper
        run: |
          set -euo pipefail
          base64 -d .github/ner-bundle.b64 | gzip -d > /tmp/ner.patch
          git checkout 165f28ba4817ecb4f9f21e874ec542e34df5661a -- .
          git apply /tmp/ner.patch
          rm -f .github/ner-bundle.b64
          rm -f .github/workflows/materialize-distributed-ner.yml
          git add -A
          git config user.name "huiyuanai709"
          git config user.email "huiyuanai709@gmail.com"
          git commit -m "Distribute LLM name extraction across cluster nodes."
          git push origin HEAD:cursor/distributed-llm-ner-e065
