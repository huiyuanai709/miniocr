name: apply-device-lost-pin

on:
  push:
    branches:
      - cursor/device-lost-temp-pdf-08b9
    paths:
      - .github/workflows/apply-device-lost-pin.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/device-lost-temp-pdf-08b9
          fetch-depth: 1
      - name: Apply source patch and pin submodules
        run: |
          set -euo pipefail
          test "$(git hash-object .github/device-lost-parts/0.b64)" = "b9ca5eb52780b6ae9ff8998660fa9cdac83ed0ba"
          test "$(git hash-object .github/device-lost-parts/1.b64)" = "c571d5acaa7091b8ac4081688c3eda159275010f"
          test "$(git hash-object .github/device-lost-parts/2.b64)" = "814da98fa0b29d6fc7afc93f23056614665e86d7"
          test "$(git hash-object .github/device-lost-parts/3.b64)" = "c1e1f48038ef110f03d6d24d6f2ba725280916b8"
          test "$(git hash-object .github/device-lost-parts/4.b64)" = "935847aa1428e6fcb72fcba748ff0cb185a894e2"
          cat .github/device-lost-parts/0.b64 .github/device-lost-parts/1.b64 .github/device-lost-parts/2.b64 .github/device-lost-parts/3.b64 .github/device-lost-parts/4.b64 | tr -d '\n' | base64 -d > /tmp/miniocr.patch
          git apply --index /tmp/miniocr.patch
          git update-index --cacheinfo 160000,d47fbc3cd5357db9c4a441c4f896251367938694,external/PDFtoImage
          git update-index --cacheinfo 160000,a672eb267c59f8e51b1b33f45a0649bef3e9b279,external/SimdPaddleOCR
          git rm -rf .github/device-lost-parts .github/workflows/apply-device-lost-pin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Log Vulkan device loss and release retained temp PDFs before delete."
          tree=$(git rev-parse 'HEAD^{tree}')
          test "$tree" = "6ad3cf9f6d3fc41bbb2522cc3c2c9ddd908f0779"
          git push origin HEAD:cursor/device-lost-temp-pdf-08b9
