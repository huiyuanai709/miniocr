# Fast managed smoke tests. Native AOT publish stays in publish.yml and is unchanged
# per RID: WeChat OCR is pure C# and does not add a native build for win-x64 or any other RID.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # MiniOcr.csproj ProjectReferences external/SimdPaddleOCR and external/PDFtoImage.
          submodules: recursive

      - name: Setup .NET 11 RC
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Build (PDFtoImage + SimdPaddleOCR project references)
        run: dotnet build ./MiniOcr.csproj -c Release

      - name: WeChat OCR detection and protobuf
        run: dotnet run -c Release --project tests/MiniOcr.WeChatSmoke

      - name: Entity extractor
        run: dotnet run -c Release --project tests/MiniOcr.EntitySmoke

      - name: Entity eval (recorded responses, no API key)
        run: dotnet run -c Release --project tests/MiniOcr.EntityEval -- --recorded

      - name: Cluster scheduler
        run: dotnet run -c Release --project tests/MiniOcr.ClusterSmoke

      - name: LLM JSON mode
        run: dotnet run -c Release --project tests/MiniOcr.LlmJsonSmoke

      - name: Cluster join benchmark
        run: dotnet run -c Release --project tests/MiniOcr.ClusterBench

      - name: Config path
        run: dotnet run -c Release --project tests/MiniOcr.ConfigPathSmoke

      - name: PDF text layer
        run: dotnet run -c Release --project tests/MiniOcr.TextLayerSmoke

  # Native AOT Metal path on Apple Silicon. Shaders are embedded resources;
  # this publish fails the job if ILC drops them or the session falls back to CPU.
  metal-smoke:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 11 RC
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview

      - name: Publish Native AOT metal smoke (osx-arm64)
        run: |
          set -euo pipefail
          uname -m
          dotnet publish tests/MiniOcr.MetalSmoke/MiniOcr.MetalSmoke.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            -p:MetalSmokeAot=true \
            -o artifacts/metal-smoke

      - name: Compare CPU and Metal text
        run: |
          set -euo pipefail
          chmod +x artifacts/metal-smoke/MiniOcr.MetalSmoke
          ./artifacts/metal-smoke/MiniOcr.MetalSmoke samples/sample-multipage.pdf
