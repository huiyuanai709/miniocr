name: apply-device-lost

on:
  push:
    branches: [cursor/vulkan-device-lost-08b9]
    paths:
      - .github/workflows/apply-device-lost.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/vulkan-device-lost-08b9
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the source patch and pin the OCR library
        run: |
          set -euo pipefail
          git apply --index device-lost.patch
          git update-index --add --cacheinfo 160000,a672eb267c59f8e51b1b33f45a0649bef3e9b279,external/SimdPaddleOCR
          git rm -f device-lost.patch .github/workflows/apply-device-lost.yml
          git config user.name "huiyuanai709"
          git config user.email "huiyuanai709@gmail.com"
          git commit -m "Cap Vulkan recognition batch on small GPUs and log device loss."
          git push origin HEAD:cursor/vulkan-device-lost-08b9
